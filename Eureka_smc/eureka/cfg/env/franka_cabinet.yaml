task: FrankaCabinet
env_name: franka_cabinet
description: to open the cabinet door

# search_score 归一化界（任务相关，覆盖 algo.score 的全局 fallback）。
# FrankaCabinet 的 consecutive_successes = 成功 env 占比 ∈ [0,1]（franka_cabinet.py:571-575，
# 抽屉 cabinet_dof_pos[:,3]>0.39 记 1，跨 env 求均值），天花板=1，无需定标。
score_metric: consecutive_successes
score_lower: 0.0
score_upper: 1.0

# 迭代数 = RF-Agent 官方每任务标准(search / test); test 保基准全量。
policy_train_iterations: 750
test_policy_train_iterations: 1500
