# env 只选择任务；algo=smc 选择 Isaac Gym 环境族统一预算协议（B=80）。
# Bi-DexHands 专用入口选择 algo=smc_bidex，即同一协议的 bidex 环境族（B=512）。
# 单任务 launcher 不覆盖 init/mutation/total budget 拆分。
defaults:
  - _self_
  - env: cartpole          # Batch-2 bring-up 任务
  - algo: smc
  - override hydra/launcher: local
  - override hydra/output: local

hydra:
  job:
    chdir: True

# LLM 参数
model: gpt-4o-2024-08-06   # chatanywhere 代理；gpt-4-0314 在该端点不可用
temperature: 1.0
suffix: GPT

# RL 训练参数
policy_train_iterations: null       # CLI 覆盖钩子；null=用 cfg/env/<task>.yaml 的 RF-Agent per-task 标准（search）
test_policy_train_iterations: null  # 同上；test 复评迭代数（RF-Agent test_max_iterations，多数任务为 search 的 2×）
num_eval: 5                    # 最终 held-out 复评次数（兼容旧 Eureka）
capture_video: False

# Weights and Biases
use_wandb: False
wandb_username: ""
wandb_project: ""
