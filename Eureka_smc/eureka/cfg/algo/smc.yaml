# SMC 搜索控制器配置（迁移计划 §7）。默认值来自 Batch-1 可行性仿真：
# 小 N 下 beta_target>=5 会导致谱系坍缩，故 Cartpole-scale 采用 N=8, beta=2, kappa=0.5。
# 详见 smc/FINDINGS_batch1.md。

authority_mode: paper_core   # paper_core | source_compat
n_islands: 1                 # 首版单岛
n_particles: 8               # 每岛粒子数 N
beta_target: 2.0             # 终端逆温 beta_target（Batch-1 推荐，避免坍缩）
kappa: 0.5                   # ESS 阈值系数（标准 SMC ~0.5，而非计划初稿的 0.9）
min_smc_iterations: 3        # max_delta_lambda = 1/min_smc_iterations
max_smc_iterations: 15       # 退火阶段上限
n_proposals: 1               # 每个重采样粒子的 MH 链长 K
max_init_retries: 3          # 初始无效粒子补采样上限（相对 N）
seed: 0                      # 岛屿 RNG 种子
migration_enabled: false     # 粒子迁移仅 source_compat 开启

# search_score 提取与归一化（计划 §5）
score:
  metric: consecutive_successes
  fallback_metric: gt_reward
  aggregate: final_window_mean   # 非 max：避免乐观高方差选择偏差（审查 #4）
  window_frac: 0.1
  lower: 0.0
  upper: 500.0                    # Cartpole max_episode_length 占位；pilot 后冻结

# 评估（计划 §5.2）
evaluation:
  search_seed_panel: [0, 1, 2]                 # 所有候选共享的冻结 CRN panel
  heldout_seed_panel: [100, 101, 102, 103, 104]  # 与搜索 panel 完全不重叠
  cache: true
