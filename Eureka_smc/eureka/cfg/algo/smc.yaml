# Isaac Gym / Bi-DexHands 环境族统一 SMC 预算协议。
# 任务只选择环境族；预算由本协议派生，单个任务 launcher 不得覆盖拆分。
#
# 首版冻结：每轮势函数 U_t=当前原始 search_score J_t，先验权重 W_t=Uniform(N)。
# rESS 控制器在这个均匀先验上重加权；W_t 均匀不等于父代采样分布 q_t 均匀。
# Isaac Gym: B=16+8×8=80；Bi-DexHands: B=64+7×64=512。
# 每个环境族的初始化批次和 mutation stage 都按其 children/population 配置完整并行。
# 物理 GPU 排布沿用原 Eureka set_freest_gpu，不属于 SMC 预算协议。

environment_family: isaac_gym

budget_protocols:
  isaac_gym:
    n_particles: 16
    init_budget: 16
    children_per_round: 8
    mutation_rounds: 8
    mutation_budget: 64
    budget: 80
    k_min: 1
  bidex:
    n_particles: 64
    init_budget: 64
    children_per_round: 64
    mutation_rounds: 7
    mutation_budget: 448
    budget: 512
    k_min: 8

# 相对插值(${.} / ${..}):Hydra 用 algo=smc 组合时整个文件被嵌套到 algo 键下,
# 绝对路径 ${n_particles} 会从根查找而失败;相对插值在独立与嵌套两种加载下都成立。
n_particles: ${.budget_protocols.${.environment_family}.n_particles}
children_per_round: ${.budget_protocols.${.environment_family}.children_per_round}
init_budget: ${.budget_protocols.${.environment_family}.init_budget}
mutation_rounds: ${.budget_protocols.${.environment_family}.mutation_rounds}
mutation_budget: ${.budget_protocols.${.environment_family}.mutation_budget}
budget: ${.budget_protocols.${.environment_family}.budget}
k_min: ${.budget_protocols.${.environment_family}.k_min}

authority_mode: paper_core   # paper_core | source_compat
n_islands: 1                 # 首版单岛
gamma: 1.0                   # 旧预算幂日程曲率（兼容/诊断保留；Full 控制器不使用）
eta: 1.0                     # 延迟进展反馈增益 η（τ_t=τ_budget(h)·exp(-η·h·Γ_{t-1})）
seed: 0                      # 岛屿 RNG 种子
max_init_repair: 8           # 初始种子 traceback-repair 最大波数（RF-Agent 式：报错喂回让 LLM 自修复）
max_same_repair: 3           # 同一种子连修失败多少次后改抽全新（RF-Agent max_same_try_cnt）
max_mutation_repair: 8       # 修改轮无效子代 traceback-repair 最大波数（RF-Agent 式；0=关。无效子代出现时才触发，全 valid 轮零开销）
migration_enabled: false     # 粒子迁移仅 source_compat 开启

# ---- 接受容忍度收紧（消融开关，默认精确 no-op，主表/recaliber 口径不受影响）----
# 现状接受核 p=sigmoid(alpha·delta/span) 在孤峰/宽 span 地形上对"改差子代"过于宽容
# （中段差满一个 span 仍 ~8% 溜进去）。β 独立压低容忍度，且不动 SMC 重采样温度。
accept_sharpness: 1.0        # β：接受判定专用锐度 z=β·alpha·delta/span。1.0=现状；消融取 5（差1.5分即基本不接受，近平局仍探索）

# RF-Agent 奖励专用 proposal action 路由（计划 §6.4.1、§6.5），与父代分配层正交。
# mode=generic（默认）：单一 eureka_reflection 通用反思。
# mode=rf：按 enabled 中各 action 对应 rf_ratio 权重确定性派发。历史料由 island 确定性从注册表
#   选出（无 RNG），无可用料时该 action 退化为普通反思。
# rf_ratio 顺序固定对应 [mutation_structure, mutation_parameter, crossover, path_reasoning,
#   different_thought]（RF-Agent 论文配比 [2,2,2,1,1]）。gate_contracts 恒 false：契约只审计
#   变异 action 命中率、不据此丢候选（接受核为 reward-only sigmoid）。
# crossover_k / history_k：crossover 展示的高分供体数、different_thought 展示的异谱系意图条数。
actions:
  mode: generic
  enabled: [mutation_structure, mutation_parameter, crossover, path_reasoning, different_thought]
  rf_ratio: [2, 2, 2, 1, 1]
  gate_contracts: false
  crossover_k: 2
  history_k: 4

# search_score 提取（新方法 §0/§2.2：直接用原始 J，**不归一化**）。
# lower/upper 已退出热路径（仅配置兼容保留）；控制器/接受/best 全用原始聚合标量。
score:
  metric: consecutive_successes
  fallback_metric: gt_reward
  aggregate: max                 # 与 Eureka/RF-Agent 原生口径统一（曲线峰值 max）；三方同表可比（2026-08-07）
  window_frac: 0.1
  lower: 0.0                      # 已退出热路径
  upper: 1.0                      # 已退出热路径

# 评估（计划 §5.2）。
# 搜索阶段单 seed(42) 评估每个奖励——与 Eureka 协议一致、预算公平；该 seed 上的表现即
# 定义为奖励的 search_score（原始 J）。所有候选共享同一 seed=CRN，使分数差值更多反映奖励
# 本身而非 seed 运气。仅最后对最优/top-k 用 heldout 多 seed 复评。
evaluation:
  search_seed_panel: [42]                          # 单 seed 搜索(固定 CRN)，与 Eureka 一致
  heldout_seed_panel: [100, 101, 102, 103, 104]    # 旧单-best 复评（兼容保留；Full 用下方 reevaluation）
  cache: true
  # 上限由环境族 population 槽位派生；init 和 mutation 均在容量允许时整批启动。
  max_concurrent_evals: ${..n_particles}
  startup_timeout_seconds: 600                      # 等待训练 import reward 源码的上限；超时会清理子进程
  training_timeout_seconds: null                    # 不设训练超时（communicate 无限等）；慢任务(5000-iter 手部)不再被误杀丢 seed。卡在 import 仍由 startup_timeout 兜底
  lock_timeout_seconds: 300                          # 获取跨进程共享 task 注入锁的上限

# Stage-boundary runtime checkpoint. `resume_from` must point to a checkpoint
# produced by the same resolved SMC configuration.
checkpoint:
  enabled: false
  path: smc_runtime_checkpoint.json
  resume_from: null

# archive → (可选 validation) → test 复评（计划 §5 阶段 D）。
# test 与 search seed 完全不重叠；成本单独记账，不计入 B。
# 预算有限:默认关闭 validation 中间层(validation_enabled=false),冠军直接取 archive
# search_score top-1,只做 test held-out。此时 archive_top_k / validation_seed_panel
# 不生效(仅在 validation_enabled=true 时使用,那时 validation 与 search/test 须两两不重叠)。
reevaluation:
  enabled: true
  validation_enabled: false                         # 关闭 validation 复评层;冠军=archive search_score top-1
  archive_top_k: 3                                  # 仅 validation_enabled=true 时:从 archive 取 top-k 进入 validation
  validation_seed_panel: [200, 201, 202]            # 仅 validation_enabled=true 时:稳定选唯一候选
  test_seed_panel: [0, 1, 2, 3, 4]                  # 对冠军做 test;与 champion 基准 seeds0-4 对齐
