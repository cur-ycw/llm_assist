# SMC 搜索控制器配置（迁移计划 §7）。默认值来自 Batch-1 可行性仿真：
# 小 N 下 beta_target>=5 会导致谱系坍缩，故 Cartpole-scale 采用 N=8, beta=2, kappa=0.5。
# 详见 smc/FINDINGS_batch1.md。

authority_mode: paper_core   # paper_core | source_compat
n_islands: 1                 # 首版单岛
n_particles: 16              # 每岛粒子数 N（16：init 池更大、且 β=2 落在 ln16≈2.77 坍缩余量内）
beta_target: 2.0             # 终端逆温 beta_target（Batch-1 推荐，避免坍缩）
kappa: 0.5                   # ESS 阈值系数（标准 SMC ~0.5，而非计划初稿的 0.9）
min_smc_iterations: 3        # max_delta_lambda = 1/min_smc_iterations
max_smc_iterations: 15       # 退火阶段上限
n_proposals: 1               # 每个重采样粒子的 MH 链长 K
max_init_retries: 3          # 初始无效粒子补采样上限（相对 N）
seed: 0                      # 岛屿 RNG 种子
migration_enabled: false     # 粒子迁移仅 source_compat 开启

# RF-Agent 奖励专用 proposal action 路由（计划 §6.4.1、§6.5）。
# mode=generic（默认）：单一 eureka_reflection 通用反思，行为=Phase-2，rng 消费不变。
# mode=rf：按 enabled 中各 action 对应 rf_ratio 权重确定性派发；Phase-3a 只实现前两个
#   变异 action（mutation_structure / mutation_parameter），crossover/path/different 留 Phase-3b。
# rf_ratio 顺序固定对应 [mutation_structure, mutation_parameter, crossover, path_reasoning,
#   different_thought]（RF-Agent 论文配比 [2,2,2,1,1]）。gate_contracts 恒 false：契约只审计
#   命中率、不据此丢候选（MH 为 reward-only）。
actions:
  mode: generic
  enabled: [mutation_structure, mutation_parameter]
  rf_ratio: [2, 2, 2, 1, 1]
  gate_contracts: false

# search_score 提取与归一化（计划 §5）。
# 注意：lower/upper 是**任务相关**的归一化界，应在各 env 配置里用 score_lower/score_upper
# 覆盖（如 franka_cabinet.yaml: upper=1，因其 consecutive_successes 是成功率 ∈[0,1]）。
# 这里的值仅作缺省 fallback。
score:
  metric: consecutive_successes
  fallback_metric: gt_reward
  aggregate: final_window_mean   # 非 max：避免乐观高方差选择偏差（审查 #4）
  window_frac: 0.1
  lower: 0.0
  upper: 1.0                      # fallback：成功率类任务的天花板；回报类任务须在 env 覆盖

# 评估（计划 §5.2）。
# 搜索阶段单 seed(42) 评估每个奖励——与 Eureka 协议一致、预算公平；该 seed 上的表现即
# 定义为奖励的 search_score，不额外多 seed 降噪(太烧预算)。所有候选共享同一 seed=CRN，
# 使分数差值更多反映奖励本身而非 seed 运气。仅最后对最优/top-k 用 heldout 多 seed 复评。
evaluation:
  search_seed_panel: [42]                          # 单 seed 搜索(固定 CRN)，与 Eureka 一致
  heldout_seed_panel: [100, 101, 102, 103, 104]    # 最后复评，与搜索 seed 完全不重叠
  cache: true
  max_concurrent_evals: 6                           # 每波并发 train.py 上限（3×3090 下 6≈每卡 2 个，给显存留余量）
